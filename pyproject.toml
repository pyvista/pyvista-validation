[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=64', 'setuptools_scm>=8']

[dependency-groups]
dev = ['pre-commit', 'pytest', 'pytest-cov']

[project]
authors = [{ name = 'The PyVista Developers', email = 'info@pyvista.org' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Developers',
  'Intended Audience :: Science/Research',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: POSIX :: Linux',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Typing :: Typed',
]
dependencies = ['numpy>=1.21.0']
description = 'Validate and standardize array-like input.'
dynamic = ['version']
keywords = ['array', 'numpy', 'validation']
license = 'MIT'
name = 'input-validation'
readme = 'README.md'
requires-python = '>=3.10'

[project.optional-dependencies]
# `vtk` and `scipy` are only needed to validate their respective object types;
# `all` is the catch-all for everything on top of numpy.
all = ['input-validation[scipy,vtk]']
scipy = ['scipy']
vtk = ['vtk']

[project.urls]
Homepage = 'https://github.com/pyvista/input-validation'

[tool.setuptools]
license-files = ['LICENSE']
packages = ['input_validation', 'input_validation._typing']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'
write_to = 'input_validation/_version.py'
