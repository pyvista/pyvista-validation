[build-system]
build-backend = 'setuptools.build_meta'
requires = ['numpy>=2.0', 'setuptools>=64', 'setuptools_scm>=8']

[dependency-groups]
dev = [
  'lxml',
  'mypy',
  'pre-commit',
  'pytest',
  'pytest-cov',
  'scipy-stubs',
  'type-assert==0.2.1',
]
docs = [
  'numpydoc==1.10.0',
  'sphinx-book-theme==1.1.4',
  'sphinx-copybutton==0.5.2',
  'sphinx-notfound-page==1.1.0',
  'sphinx==8.2.3',
]

[project]
authors = [{ name = 'The PyVista Developers', email = 'info@pyvista.org' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Developers',
  'Intended Audience :: Science/Research',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: POSIX :: Linux',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Typing :: Typed',
]
dependencies = [
  'numpy>=1.21.0',
  'typing-extensions>=4.4; python_version < "3.13"',
]
description = 'Validate and standardize array-like input.'
dynamic = ['version']
keywords = ['array', 'numpy', 'validation']
license = 'MIT'
name = 'pyvista-validation'
readme = 'README.md'
requires-python = '>=3.10'

[project.optional-dependencies]
# `vtk` and `scipy` are only needed to validate their respective object types;
# `all` is the catch-all for everything on top of numpy.
all = ['pyvista-validation[scipy,vtk]']
scipy = ['scipy']
vtk = ['vtk']

[project.urls]
Documentation = 'https://validation.pyvista.org/'
Homepage = 'https://github.com/pyvista/pyvista-validation'

[tool.uv.dependency-groups]
# The pinned Sphinx needs a newer Python than the package itself supports.
docs = { requires-python = '>=3.11' }

[tool.coverage.run]
branch = true
# _typing is imported only by type checkers, never at runtime.
omit = ['*/_version.py', 'pyvista_validation/_typing/*']
parallel = true
source = ['pyvista_validation']

[tool.coverage.report]
# Overload stubs are signatures for type checkers; their bodies never run.
exclude_also = ['^\\s*@overload$']

[tool.mypy]
enable_error_code = ['ignore-without-code', 'redundant-expr', 'truthy-bool']
packages = ['pyvista_validation']
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = '--cov=pyvista_validation --cov-fail-under=95'
testpaths = 'tests'
type_assert_cases = 'tests/typing/cases'

[tool.ruff]
indent-width = 4
line-length = 99

[tool.ruff.format]
docstring-code-format = true
# From https://numpydoc.readthedocs.io/en/latest/format.html
# The length of docstring lines should be kept to 75 characters to facilitate
# reading the docstrings in text terminals.
docstring-code-line-length = 75
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
  'A',
  'B',
  'C4',
  'D',
  'E',
  'EM',
  'F',
  'FA',
  'I',
  'ICN',
  'N',
  'PERF',
  'PGH',
  'PIE',
  'PT',
  'RET',
  'RSE',
  'RUF',
  'SIM',
  'T10',
  'T20',
  'TCH',
  'TID',
  'UP',
  'W',
  'YTT',
]
ignore = ['D203', 'D211', 'D213']

[tool.ruff.lint.per-file-ignores]
# These are runtime type aliases, not annotations. `Union` is required because
# `X | Y` builds a `types.UnionType`, which cannot be subscripted to substitute
# a TypeVar on Python 3.10.
'pyvista_validation/_typing/*' = ['UP007']
'tests/*' = ['D103']
# The benchmark prints its table.
'benchmarks/*' = ['T201']
# Overload stubs are one line each, kept out of the formatter with `fmt: off`.
'pyvista_validation/_cast_array.py' = ['E501']
'pyvista_validation/check.py' = ['E501']
'pyvista_validation/validate.py' = ['E501']

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = true
force-sort-within-sections = true
required-imports = ['from __future__ import annotations']

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.setuptools]
license-files = ['LICENSE']
packages = ['pyvista_validation', 'pyvista_validation._typing']

[tool.setuptools.package-data]
pyvista_validation = ['py.typed']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'
write_to = 'pyvista_validation/_version.py'
