# Test coverage and typing coverage are uploaded under separate flags so
# neither number hides the other.
flags:
  tests:
    paths: [pyvista_validation/]
    carryforward: true
  typing:
    paths: [pyvista_validation/]
    carryforward: true

coverage:
  status:
    project:
      tests:
        flags: [tests]
        target: 95%
      typing:
        flags: [typing]
        # mypy scores every line that uses a type variable as imprecise, so the overloads
        # that return the dtype they are given keep this just short of 100%.
        target: 99%
    patch:
      tests:
        flags: [tests]
        target: 95%
      typing:
        flags: [typing]
        # mypy scores every line that uses a type variable as imprecise, so the overloads
        # that return the dtype they are given keep this just short of 100%.
        target: 99%
