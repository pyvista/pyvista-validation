name: CI

# `pull_request` is deliberately unfiltered: filtering it by base branch would
# skip every pull request in a stack that does not target main.
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv sync --group dev
    - run: uv run pre-commit run --all-files --show-diff-on-failure
      env:
          # This hook exists to stop *local* commits straight to main; it
          # would always fail here since CI checks out that branch/tag directly.
        SKIP: no-commit-to-branch

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv sync --group dev --extra all --python ${{ matrix.python-version }}
    - name: Confirm the C extension built
      run: uv run python -c "from pyvista_validation import _accelerate; assert _accelerate.enabled"
    - run: uv run pytest tests/ --ignore=tests/typing --cov
    - name: Test the pure Python implementations too
      run: uv run pytest tests/ --ignore=tests/typing --cov --cov-append --cov-report=xml
      env:
        PYVISTA_VALIDATION_ACCELERATE: '0'
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f   # v7.0.0
      with:
        files: ./coverage.xml
        flags: tests
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typing:
      # mypy's Cobertura report counts a line as covered when every expression on
      # it has a precise type, so codecov shows typing coverage next to test coverage.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv sync --group dev --extra all --python 3.14
    - run: uv run --no-sync mypy --cobertura-xml-report typing-coverage --txt-report typing-coverage
    - run: cat typing-coverage/index.txt
    - run: uv run --no-sync pytest tests/typing --no-cov
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f   # v7.0.0
      with:
        files: ./typing-coverage/cobertura.xml
        flags: typing
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-minimal:
      # numpy is the only hard dependency; this proves the VTK and SciPy code
      # paths stay optional rather than quietly becoming required.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv sync --group dev --python ${{ matrix.python-version }}
    - run: uv run python -c "import pyvista_validation, sys; assert not [m for m in sys.modules if m.startswith(('vtkmodules', 'scipy'))]"
    - run: uv run pytest tests/ --ignore=tests/typing --no-cov
    - run: uv run pytest tests/ --ignore=tests/typing --no-cov
      env:
        PYVISTA_VALIDATION_ACCELERATE: '0'

  downstream:
    name: Downstream PyVista
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYVISTA_OFF_SCREEN: 'true'
      PYVISTA_REF: main   # the PyVista ref to integrate against
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: sudo apt-get update && sudo apt-get install --yes libgl1 libxrender1 xvfb
    - name: Clone PyVista
      run: git clone --depth=1 --branch "$PYVISTA_REF" --single-branch https://github.com/pyvista/pyvista.git "${{ runner.temp }}/pyvista"
    - name: Install PyVista, with this checkout overriding its validation pin
      run: |
        uv venv
        uv pip install --editable "${{ runner.temp }}/pyvista" --group test --directory "${{ runner.temp }}/pyvista"
        uv pip install --editable '.[all]'
    - name: Confirm the local checkout is the installed pyvista-validation
      run: .venv/bin/python -c "import os, pyvista_validation; f = pyvista_validation.__file__; print(f); assert f.startswith(os.environ['GITHUB_WORKSPACE'])"
    - name: Run PyVista's core test suite
      working-directory: ${{ runner.temp }}/pyvista
      run: xvfb-run ${{ github.workspace }}/.venv/bin/python -m pytest tests/core -n auto

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv sync --group docs --extra all --python 3.14
    - run: uv run --no-sync sphinx-build -W --keep-going -b html doc doc/_build/html
    - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4.0.0
      with:
        path: doc/_build/html/

  deploy-docs:
      # Publishes directly from the workflow artifact; no gh-pages branch.
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
      id: deployment

  sdist:
    needs: [pre-commit, test, typing, test-minimal, downstream, docs]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: false
    - run: uv build --sdist
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: dist-sdist
        path: dist/

  wheels:
      # The extension targets the stable ABI, so one wheel per platform serves every Python.
    needs: [pre-commit, test, typing, test-minimal, downstream, docs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae   # v4.2.1
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: dist-${{ matrix.os }}
        path: wheelhouse/

  publish:
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        pattern: dist-*
        path: dist/
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # release/v1
